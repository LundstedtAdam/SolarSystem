<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>3D Solsystem Simulering</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="En interaktiv 3D-simulering av vårt solsystem">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading">Laddar solsystemet...</div>
    <div id="ui" style="display: none;">
        <div class="control">
            <label for="speed">Speed:</label>
            <label class="slider">
                <input type="range" class="level" id="speed" min="0.1" max="10" step="0.1" value="1">
                <output class="value" for="speed" id="speedValue">1x</output>
              </label>
        </div>        
          <button id="toggleOrbits" class="button" data-text="Awesome">
            <span class="actual-text">&nbsp;Orbits&nbsp;</span>
            <span aria-hidden="true" class="hover-text">&nbsp;Orbits&nbsp;</span>
        </button>
        <button id="resetCamera" class="button" data-text="Awesome">
            <span class="actual-text">&nbsp;Reset&nbsp;</span>
            <span aria-hidden="true" class="hover-text">&nbsp;Reset&nbsp;</span>
        </button>
    </div>
    <div id="infoPanel" class="info-panel">
        <button class="close-btn">X</button>
        <div class="info-content">
            <div class="avatar-container">
                <img src="assets/astro.webp" alt="Friendly robot guide" class="robot-avatar">
            </div>
            <div class="info-text">
                <!-- Innehåll kommer att fyllas dynamiskt av JavaScript -->
            </div>
        </div>
    </div>
    <canvas id="solarSystemCanvas"></canvas>
    <script type="module" src="solarSystem.js"></script>
</body>
</html>
